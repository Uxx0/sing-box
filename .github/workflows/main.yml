name: Build Android Naive
on:
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # 使用较新的 Go 版本

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d # Sing-box 推荐的 NDK 版本
          add-to-path: true

      - name: Build Sing-box for Android ARM64
        run: |
          # 设置编译环境变量
          export GOOS=android
          export GOARCH=arm64
          export CGO_ENABLED=1
          
          # 设置 NDK 编译器路径 (这是最容易出错的地方，GitHub Action 里路径通常是固定的)
          export CC=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          export CXX=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++
          
          # 开始编译
          # 注意：这里的 -tags 加上了 with_naive_outbound
          go build -v -trimpath -ldflags "-s -w -X 'github.com/sagernet/sing-box/constant.Version=1.13-beta-custom'" \
            -tags "with_quic,with_dhcp,with_wireguard,with_utls,with_naive_outbound" \
            -o sing-box-android-arm64 \
            ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: sing-box-android-arm64
